{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <h4>Delete this message?</h4>
    <p class="text-body-secondary">"{{ message.body }}"</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <!-- this button submits a POST, which is what actually triggers deletion in the view -->
        <a href="{% url 'conversation_detail' message.conversation.id %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
