{% extends 'base.html' %}

{% block content %}

<!-- Page Header -->
<header class="brutalist-page-header">
    <div class="container">
        <div class="brutalist-header-content">
            <span class="brutalist-label">ACCOUNT / SETTINGS</span>
            <h1>UPDATE INFO</h1>
            <p>Update your profile and shipping information.</p>
        </div>
    </div>
</header>


<!-- Update Information -->
<section class="brutalist-section">
    <div class="container">
        <div class="update-info-wrapper">

            <form method="POST" action="{% url 'update_info' %}" class="brutalist-form">
                {% csrf_token %}

                <!-- Billing Information -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-number">01</span>
                        <h2>BILLING INFORMATION</h2>
                    </div>

                    <div class="form-fields">
                        {{ form.as_p }}
                    </div>
                </div>


                <!-- Shipping Information -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-number">02</span>
                        <h2>SHIPPING INFORMATION</h2>
                    </div>

                    <div class="form-fields">
                        {{ shipping_form.as_p }}
                    </div>
                </div>


                <!-- Submit -->
                <div class="form-submit">
                    <button type="submit" class="brutalist-button">
                        SAVE CHANGES
                        <span>→</span>
                    </button>
                </div>

            </form>

        </div>
    </div>
</section>

{% endblock %}
