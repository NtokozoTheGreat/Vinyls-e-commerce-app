{% extends 'base.html' %}

{% block content %}

<!-- Page Header -->
<header class="brutalist-page-header">
    <div class="container">
        <div class="brutalist-header-content">
            <span class="brutalist-label">ACCOUNT / SECURITY</span>

            <h1>UPDATE PASSWORD</h1>

            <p>
                Change your password and keep your account secure.
            </p>
        </div>
    </div>
</header>


<!-- Password Form -->
<section class="brutalist-section">
    <div class="container">
        <div class="update-info-wrapper">

            <form method="POST"
                  action="{% url 'update_password' %}"
                  class="brutalist-form">

                {% csrf_token %}

                <!-- Password Section -->
                <div class="form-section">

                    <div class="form-section-header">
                        <span class="section-number">01</span>

                        <h2>NEW PASSWORD</h2>
                    </div>

                    <div class="form-fields">
                        {{ form.as_p }}
                    </div>

                </div>


                <!-- Submit -->
                <div class="form-submit">

                    <button type="submit" class="brutalist-button">
                        UPDATE PASSWORD
                        <span>→</span>
                    </button>

                </div>

            </form>

        </div>
    </div>
</section>

{% endblock %}
