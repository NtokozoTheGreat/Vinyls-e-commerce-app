{% extends 'base.html' %}

{% block content %}

<!-- Page Header -->
<header class="brutalist-page-header">
    <div class="container">

        <p class="brutalist-eyebrow">
            VINYLS / COLLECTION
        </p>

        <h1>
            GENRES.
        </h1>

        <p class="brutalist-subtitle">
            Explore records by sound, style and culture.
        </p>

    </div>
</header>


<!-- Genre Collection -->
<section class="brutalist-section">

    <div class="container">

        <div class="brutalist-section-heading">
            <span>01</span>
            <h2>EXPLORE BY GENRE</h2>
        </div>


        <div class="brutalist-genre-grid">

            {% for category in categories %}

            <a
                href="{% url 'category' category.slug %}"
                class="brutalist-genre-card"
            >

                <!-- Genre Image -->
                <div class="brutalist-genre-image">

                    <img
                        src="{{ category.image.url }}"
                        alt="{{ category }}"
                    >

                    <span class="brutalist-genre-number">
                        {{ forloop.counter|stringformat:"02d" }}
                    </span>

                </div>


                <!-- Genre Name -->
                <div class="brutalist-genre-content">

                    <h3>
                        {{ category }}
                    </h3>

                    <span class="brutalist-genre-arrow">
                        →
                    </span>

                </div>

            </a>

            {% endfor %}

        </div>

    </div>

</section>

{% endblock %}
